name: Unity WebGL RC

on:
  push:
    branches:
      - unity/research-lab
      - unity/research-lab-testing
    paths:
      - 'unity/**'
      - '.github/workflows/unity-webgl.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unity-webgl-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      license_ready: ${{ steps.license.outputs.ready }}
    steps:
      - id: license
        name: Check Unity activation
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          if [ -n "$UNITY_LICENSE" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Unity license file secret is configured."
          elif [ -n "$UNITY_EMAIL" ] && [ -n "$UNITY_PASSWORD" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Unity account credentials are configured."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::error title=Unity activation missing::Configure UNITY_LICENSE, or UNITY_EMAIL + UNITY_PASSWORD, before running Unity tests/builds."
            exit 1
          fi

  test-and-build:
    needs: preflight
    if: needs.preflight.outputs.license_ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Run Unity EditMode tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: unity
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          testMode: EditMode
          artifactsPath: unity-test-results

      - name: Build WebGL release candidate
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: unity
          targetPlatform: WebGL
          unityVersion: 2022.3.62f1
          customParameters: -executeMethod DariaExe.Editor.WebGLBuild.Build
          buildName: daria-exe-research-lab

      - name: Upload WebGL candidate
        uses: actions/upload-artifact@v4
        with:
          name: daria-exe-unity-webgl-rc
          path: build/WebGL
          if-no-files-found: error

      - name: Upload Unity test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-test-results
          path: unity-test-results
          if-no-files-found: ignore
